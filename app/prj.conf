# Console / shell so you can drive the sequencer interactively
CONFIG_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="beatbox:~$ "

# Logging kept minimal so it doesn't interleave with the WAV sample dump
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_MAIN_STACK_SIZE=5120
CONFIG_SHELL_STACK_SIZE=4096

# Give the sequencer thread a bit more room since rendering is done inline
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_DISPLAY=y
CONFIG_INPUT=y

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=98304
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_Z_FLUSH_THREAD=n

# Catch stack overlflow
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
